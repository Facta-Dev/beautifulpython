<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="t d">
  <title id="t">Beautiful Python — architecture</title>
  <desc id="d">Clients flow through a FastAPI composition root into vertical slices (auth, retrieval), depend on ports (Protocols), and reach an I/O-free domain; adapters implement the ports and the CI gates enforce the contracts.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .t { font-size: 15px; font-weight: 700; fill: #E2E8F0; }
    .s { font-size: 11px; fill: #94A3B8; }
    .l { font-size: 11px; letter-spacing: 1.5px; fill: #94A3B8; }
    .p { font-size: 11px; fill: #8FBBE0; }
    .c { font-size: 12.5px; font-weight: 700; fill: #E2E8F0; }
    .card { fill: #131B2E; stroke: #1E293B; stroke-width: 1; }
    .pill { fill: #0B1020; stroke: #3776AB; stroke-width: 1; }
    .f { stroke: #94A3B8; stroke-width: 1.2; }
    .fd { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 3 4; opacity: 0.7; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="560" rx="14" fill="#0B1020"/>

  <!-- header -->
  <text x="44" y="48" font-size="23" font-weight="700" fill="#3776AB">Beautiful Python — architecture</text>
  <text x="44" y="72" class="s" font-size="12">FastAPI · TaskIQ · Dragonfly · PostgreSQL + pgvector · SQLAlchemy 2.0 async · Alembic · Pydantic v2 · mypy --strict · import-linter · ruff · uv</text>
  <rect x="856" y="28" width="194" height="26" rx="13" class="pill"/>
  <text x="953" y="45" class="p" text-anchor="middle" font-size="11" letter-spacing="1">CONTRACTS NON-WAIVABLE</text>

  <!-- ring labels -->
  <text x="76" y="130" class="l" text-anchor="middle">CLIENTS</text>
  <text x="246" y="130" class="l" text-anchor="middle">COMPOSITION</text>
  <text x="464" y="130" class="l" text-anchor="middle">SLICES</text>
  <text x="682" y="130" class="l" text-anchor="middle">PORTS</text>
  <text x="928" y="130" class="l" text-anchor="middle">DOMAIN</text>

  <!-- flow arrows (between ring cards) -->
  <line class="f" x1="128" y1="222" x2="166" y2="222" marker-end="url(#ar)"/>
  <line class="f" x1="324" y1="222" x2="362" y2="222" marker-end="url(#ar)"/>
  <line class="f" x1="564" y1="222" x2="602" y2="222" marker-end="url(#ar)"/>
  <line class="f" x1="760" y1="222" x2="798" y2="222" marker-end="url(#ar)"/>

  <!-- CLIENTS -->
  <rect x="24" y="142" width="104" height="160" rx="10" class="card"/>
  <text x="76" y="174" class="t" text-anchor="middle">HTTP</text>
  <text x="76" y="194" class="s" text-anchor="middle">routers · CLI</text>
  <text x="76" y="228" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle">Tests</text>
  <text x="76" y="248" class="s" text-anchor="middle">fakes injected</text>

  <!-- COMPOSITION -->
  <rect x="168" y="142" width="156" height="160" rx="10" class="card"/>
  <text x="246" y="176" class="t" text-anchor="middle">composition</text>
  <text x="246" y="198" class="s" text-anchor="middle">root · FastAPI factory</text>
  <text x="246" y="216" class="s" text-anchor="middle">Depends · AppState</text>
  <text x="246" y="234" class="s" text-anchor="middle">lifespan wiring</text>
  <text x="246" y="256" class="s" text-anchor="middle">prod: Pg adapters</text>
  <text x="246" y="274" class="s" text-anchor="middle">tests: with_repos fakes</text>

  <!-- SLICES -->
  <rect x="364" y="142" width="200" height="76" rx="10" class="card"/>
  <text x="464" y="166" class="t" text-anchor="middle">auth</text>
  <text x="464" y="186" class="s" text-anchor="middle">http: router · pydantic v2</text>
  <text x="464" y="202" class="s" text-anchor="middle">signup · sessions · RBAC</text>
  <rect x="364" y="226" width="200" height="76" rx="10" class="card"/>
  <text x="464" y="250" class="t" text-anchor="middle">retrieval</text>
  <text x="464" y="270" class="s" text-anchor="middle">http: router · pydantic v2</text>
  <text x="464" y="286" class="s" text-anchor="middle">pgvector search</text>

  <!-- PORTS -->
  <rect x="604" y="142" width="156" height="160" rx="10" class="card"/>
  <text x="682" y="176" class="t" text-anchor="middle">ports</text>
  <text x="682" y="198" class="s" text-anchor="middle">Protocols (typing)</text>
  <text x="682" y="216" class="s" text-anchor="middle">use-cases depend on</text>
  <text x="682" y="232" class="s" text-anchor="middle">the Protocol,</text>
  <text x="682" y="250" class="s" text-anchor="middle">mypy --strict verifies,</text>
  <text x="682" y="274" class="s" text-anchor="middle">Pg* adapters · fakes</text>

  <!-- DOMAIN (accented, I/O-free) -->
  <rect x="800" y="142" width="256" height="160" rx="10" fill="#3776AB" fill-opacity="0.18" stroke="#3776AB" stroke-opacity="0.45"/>
  <text x="928" y="176" class="t" text-anchor="middle">domain</text>
  <text x="928" y="198" class="s" text-anchor="middle">IDs · Role · DomainError</text>
  <text x="928" y="216" class="s" text-anchor="middle">frozen dataclasses</text>
  <text x="928" y="236" fill="#8FBBE0" font-size="11" text-anchor="middle">pure — zero I/O</text>
  <text x="928" y="256" class="s" text-anchor="middle">no fastapi · sqlalchemy</text>
  <text x="928" y="276" class="s" text-anchor="middle">httpx · taskiq · redis</text>

  <!-- boundary gate pills (on the ring boundaries) -->
  <rect x="282" y="211" width="124" height="22" rx="11" class="pill"/>
  <text x="344" y="226" class="p" text-anchor="middle">layers · inward only</text>
  <rect x="400" y="211" width="128" height="22" rx="11" class="pill"/>
  <text x="464" y="226" class="p" text-anchor="middle">slice-independence</text>
  <rect x="532" y="211" width="104" height="22" rx="11" class="pill"/>
  <text x="584" y="226" class="p" text-anchor="middle">TID251/252</text>
  <rect x="706" y="211" width="148" height="22" rx="11" class="pill"/>
  <text x="780" y="226" class="p" text-anchor="middle">domain-purity · I/O-free</text>

  <!-- adapters row -->
  <text x="364" y="326" class="l">ADAPTERS · implement the ports</text>
  <line class="fd" x1="410" y1="302" x2="410" y2="338" marker-end="url(#ar)"/>
  <line class="fd" x1="520" y1="302" x2="520" y2="338" marker-end="url(#ar)"/>
  <line class="fd" x1="804" y1="370" x2="818" y2="370" marker-end="url(#ar)"/>

  <rect x="364" y="340" width="212" height="60" rx="10" class="card"/>
  <text x="380" y="364" font-size="13" font-weight="700" fill="#E2E8F0">Pg adapters</text>
  <text x="380" y="382" class="s">SQLAlchemy 2.0 async · asyncpg</text>
  <text x="380" y="396" class="s">Alembic migrations</text>

  <rect x="592" y="340" width="212" height="60" rx="10" class="card"/>
  <text x="608" y="364" font-size="13" font-weight="700" fill="#E2E8F0">TaskIQ tasks</text>
  <text x="608" y="382" class="s">broker: Dragonfly · .kiq</text>
  <text x="608" y="396" class="s">workers own sessions</text>

  <rect x="820" y="340" width="236" height="60" rx="10" class="card"/>
  <text x="836" y="364" font-size="13" font-weight="700" fill="#E2E8F0">vectors</text>
  <text x="836" y="382" class="s">pgvector · cosine index pinned</text>
  <text x="836" y="396" class="s">SQL stays in the adapter</text>

  <!-- CI gates -->
  <line x1="24" y1="424" x2="1056" y2="424" stroke="#1E293B" stroke-width="1"/>
  <text x="24" y="450" class="l">CI GATES</text>
  <rect x="24" y="464" width="232" height="52" rx="10" class="card"/>
  <text x="40" y="488" class="c">check-skill.py</text>
  <text x="40" y="506" class="s">skills · evals · manifests</text>
  <rect x="268" y="464" width="232" height="52" rx="10" class="card"/>
  <text x="284" y="488" class="c">check-lints.py</text>
  <text x="284" y="506" class="s">every ruff rule still fires</text>
  <rect x="512" y="464" width="232" height="52" rx="10" class="card"/>
  <text x="528" y="488" class="c">check-examples.py</text>
  <text x="528" y="506" class="s">every example compiles</text>
  <rect x="756" y="464" width="232" height="52" rx="10" class="card"/>
  <text x="772" y="488" class="c">contracts unittest</text>
  <text x="772" y="506" class="s">import-linter pinned in CI</text>

  <text x="24" y="540" class="s">Env: uv — venvs and uv.lock committed · the contracts are non-waivable; when a gate fires, re-cut the layout.</text>
</svg>