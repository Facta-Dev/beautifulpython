# BeautifulPython drop-in mypy configuration. Paste into pyproject.toml under
# [tool.mypy] or keep as mypy.ini / .mypy.ini next to pyproject.toml.
[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_reexport = True

# Third-party packages without stubs, one override per package, never in code:
# [mypy-someuntypedpkg]
# ignore_missing_imports = True
