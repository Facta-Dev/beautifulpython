name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check skill
        run: python3 scripts/check-skill.py

  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff like the Rust repo pins clippy: the violations harness proves the
      # selected rules fire on a specific engine version.
      - name: Install ruff
        run: pip install "ruff==0.12.3"
      - name: Prove every lint in lints/ruff.toml fires
        run: python3 scripts/check-lints.py
      # import-linter contracts are the unbreakable gate: the config must stay
      # parseable (contracts themselves run in instantiated backend projects with
      # `lint-imports`; a removed or emptied contract fails here).
      - name: Validate import-linter contracts config
        run: |
          python3 - <<'EOF'
          import configparser
          cp = configparser.ConfigParser()
          cp.read("lints/import-linter.toml")
          sections = cp.sections()
          assert "importlinter" in sections, "missing [importlinter] root section"
          contracts = [s for s in sections if s.startswith("importlinter:contract:")]
          assert contracts, "no contracts found in lints/import-linter.toml"
          for section in contracts:
              ctype = cp.get(section, "type")
              assert ctype in ("layers", "forbidden", "independence"), (
                  "contract %s has invalid type %s" % (section, ctype)
              )
          assert any(cp.get(s, "type") == "layers" for s in contracts), "layered contract missing"
          assert any(cp.get(s, "type") == "forbidden" for s in contracts), "domain-purity contract missing"
          print("import-linter contracts OK:", contracts)
          EOF

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every Python example in the skills and docs
        run: python3 -I scripts/check-examples.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff is pinned so test_lints_job_green (e2e) runs instead of skipping in CI.
      - name: Install ruff (pinned, matching the lints job)
        run: pip install "ruff==0.12.3"
      - name: Run the unittest suite (unit, contracts, integration, e2e)
        run: python3 -I -m unittest discover -s tests -t .
